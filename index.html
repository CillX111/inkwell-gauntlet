<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;background:#1c130c">
<title>Inkwell Gauntlet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Special+Elite&display=swap">
<style>
/* Layout: one 16:9 film-frame canvas centred in a dark projection booth; on touch screens a control pad floats over the frame */
:root{
  --booth:#17100b;
  --frame:#2c1e13;
  --paper:#efe2c2;
  --ink:#1c130c;
  --accent:#c8402c;
  --font-display:"Bowlby One SC","Arial Black",Impact,sans-serif;
  --font-body:"Special Elite","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--booth);color:var(--paper);font-family:var(--font-body);overflow:hidden;box-sizing:border-box;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;flex:none;max-width:100%}
#game{display:block;width:100%;height:100%;border-radius:10px;background:var(--ink);box-shadow:0 0 0 3px var(--frame),0 20px 60px rgba(0,0,0,.65);outline:none}
#game:focus-visible{box-shadow:0 0 0 3px var(--accent),0 20px 60px rgba(0,0,0,.65)}
#touch{position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(239,226,194,.6);background:rgba(28,19,12,.38);color:var(--paper);
  font:clamp(9px,1.6vw,14px) var(--font-display);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.tb.on{background:rgba(200,64,44,.55)}
#pad{left:2%;bottom:5%;width:21%;aspect-ratio:1;max-width:170px}
#pad::after{content:"";position:absolute;inset:38%;border-radius:50%;background:rgba(239,226,194,.35)}
.b-jump{right:3%;bottom:6%;width:11%;aspect-ratio:1}
.b-shoot{right:15%;bottom:4%;width:11%;aspect-ratio:1}
.b-dash{right:4%;bottom:31%;width:9%;aspect-ratio:1}
.b-ex{right:15%;bottom:28%;width:9%;aspect-ratio:1}
.b-swap{right:26%;bottom:6%;width:7%;aspect-ratio:1}
.b-pause{right:2%;top:3%;width:6%;aspect-ratio:1}
@media (prefers-reduced-motion: reduce){ #game{box-shadow:0 0 0 3px var(--frame)} }
</style>

<div id="wrap">
  <canvas id="game" tabindex="0" aria-label="Inkwell Gauntlet game screen. Arrow keys move, Z jumps, X shoots."></canvas>
  <div id="touch" hidden>
    <div class="tb" id="pad" aria-label="Move"></div>
    <div class="tb b-jump" data-act="jump">JUMP</div>
    <div class="tb b-shoot" data-act="shoot">SHOOT</div>
    <div class="tb b-dash" data-act="dash">DASH</div>
    <div class="tb b-ex" data-act="ex">EX</div>
    <div class="tb b-swap" data-act="swap">SWAP</div>
    <div class="tb b-pause" data-act="pause">II</div>
  </div>
</div>

<script>
(()=>{'use strict';
/* =========================================================
   CONSTANTS & UTILITIES
   ========================================================= */
const W=960,H=540,GROUND=462,TAU=Math.PI*2;
const INK='#1c130c',PAPER='#efe2c2',PINK='#f06aa8',RED='#c8402c',GOLD='#d9a63a',CREAM='#f6ecd2';
const FD='"Bowlby One SC","Arial Black",Impact,sans-serif', FB='"Special Elite","Courier New",monospace';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
function h1(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
let BOIL=0, CLOCK=0, RS=1;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const colCache={};
function rgb(h){if(h[0]==='#'&&h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];return colCache[h]||(colCache[h]=h[0]==='#'?[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]:h.match(/\d+/g).slice(0,3).map(Number))}
function tint(h,a){const [r,g,b]=rgb(h),t=a>0?255:0,k=Math.abs(a);return `rgb(${Math.round(r+(t-r)*k)},${Math.round(g+(t-g)*k)},${Math.round(b+(t-b)*k)})`}

function resize(){
  const b=document.body,cs=getComputedStyle(b);
  const aw=b.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=b.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const w=Math.max(240,Math.min(aw,ah*16/9));
  wrap.style.width=w+'px';wrap.style.height=(w*9/16)+'px';
  RS=clamp(w*(devicePixelRatio||1)/W,.75,1.6);
  cv.width=Math.round(W*RS);cv.height=Math.round(H*RS);
  SPR.clear();
}

/* =========================================================
   INK DRAWING KIT — wobbly "boiling" outlines, watercolour shading
   ========================================================= */
function blobPath(c,x,y,rx,ry,seed,amt=.045,n=16,rot=0){
  const p=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+rot,j=1+(h1(seed*13.7+i*3.1+BOIL*51.3)-.5)*2*amt;p.push(x+Math.cos(a)*rx*j,y+Math.sin(a)*ry*j)}
  c.beginPath();
  let mx=(p[2*n-2]+p[0])/2,my=(p[2*n-1]+p[1])/2;c.moveTo(mx,my);
  for(let i=0;i<n;i++){const k=(i+1)%n;c.quadraticCurveTo(p[2*i],p[2*i+1],(p[2*i]+p[2*k])/2,(p[2*i+1]+p[2*k+1])/2)}
  c.closePath();
}
function inkStroke(c,lw=3){c.lineWidth=lw;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';c.stroke()}
function shade(c,x,y,rx,ry,col){
  const g=c.createRadialGradient(x-rx*.38,y-ry*.45,Math.min(rx,ry)*.08,x,y,Math.max(rx,ry)*1.18);
  g.addColorStop(0,tint(col,.38));g.addColorStop(.55,col);g.addColorStop(1,tint(col,-.38));c.fillStyle=g;c.fill();
}
function ball(c,x,y,rx,ry,col,seed=1,lw=3,amt=.045){blobPath(c,x,y,rx,ry,seed,amt);shade(c,x,y,rx,ry,col);if(lw)inkStroke(c,lw)}
function flat(c,x,y,rx,ry,col,seed=1,lw=3,amt=.045){blobPath(c,x,y,rx,ry,seed,amt);c.fillStyle=col;c.fill();if(lw)inkStroke(c,lw)}
function wrect(c,x,y,w,h,seed=1,j=2){
  const pts=[[x,y],[x+w/2,y],[x+w,y],[x+w,y+h/2],[x+w,y+h],[x+w/2,y+h],[x,y+h],[x,y+h/2]];
  c.beginPath();pts.forEach((p,i)=>{const px=p[0]+(h1(seed+i*7.3+BOIL*3.1)-.5)*2*j,py=p[1]+(h1(seed*2.1+i*5.7+BOIL*9.7)-.5)*2*j;i?c.lineTo(px,py):c.moveTo(px,py)});c.closePath();
}
function hose(c,x1,y1,x2,y2,bend,w,col){
  const mx=(x1+x2)/2-(y2-y1)*bend,my=(y1+y2)/2+(x2-x1)*bend;
  c.beginPath();c.moveTo(x1,y1);c.quadraticCurveTo(mx,my,x2,y2);c.lineCap='round';
  c.lineWidth=w+5;c.strokeStyle=INK;c.stroke();c.lineWidth=w;c.strokeStyle=col;c.stroke();
}
function pieEye(c,x,y,rx,ry,lx=0,ly=0,lw=2.5){
  flat(c,x,y,rx,ry,'#fbf6e8',x*3+y,lw,.05);
  const px=x+lx*rx*.35,py=y+ly*ry*.3,pr=Math.min(rx*.55,ry*.5);
  c.beginPath();c.moveTo(px,py);c.ellipse(px,py,pr*.8,pr*1.15,0,-.45,-1.25+TAU);c.closePath();c.fillStyle=INK;c.fill();
}
function brow(c,x1,y1,x2,y2,w=6){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=w;c.strokeStyle=INK;c.lineCap='round';c.stroke()}
function txt(c,s,x,y,size,col=PAPER,align='center',font=FD,ol=true,olw){
  c.font=`${size}px ${font}`;c.textAlign=align;c.textBaseline='middle';
  if(ol){c.lineWidth=olw||Math.max(3,size*.16);c.strokeStyle=INK;c.lineJoin='round';c.strokeText(s,x,y)}
  c.fillStyle=col;c.fillText(s,x,y);
}
function txt3d(c,s,x,y,size,col,depth=8,side='#6a2c1c'){
  c.font=`${size}px ${FD}`;c.textAlign='center';c.textBaseline='middle';
  for(let i=depth;i>0;i--){c.fillStyle=i===depth?INK:side;c.fillText(s,x+i*.7,y+i)}
  txt(c,s,x,y,size,col);
}
function wrapText(c,s,x,y,maxW,lh,size,col=PAPER,align='left',font=FB){
  c.font=`${size}px ${font}`;c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;
  const words=s.split(' ');let line='',yy=y;
  for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lh}else line=t}
  if(line)c.fillText(line,x,yy);return yy;
}
function star(c,x,y,r,ri,n=5,rot=-Math.PI/2,seed=1){
  c.beginPath();for(let i=0;i<n*2;i++){const rr=(i%2?ri:r)*(1+(h1(seed+i*2.7+BOIL*4.1)-.5)*.08),a=rot+i/(n*2)*TAU;i?c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):c.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();
}

/* ---------- bullet sprites, pre-drawn in 3 boil frames ---------- */
const SPR=new Map();
function sprite(kind,col,r){
  const key=kind+col+r;let s=SPR.get(key);if(s)return s;
  const S=Math.ceil(r*2+18),frames=[];
  for(let f=0;f<3;f++){
    const cc=document.createElement('canvas');cc.width=cc.height=Math.ceil(S*RS);
    const g=cc.getContext('2d');g.scale(RS,RS);g.translate(S/2,S/2);
    const ob=BOIL;BOIL=f;bulletShape(g,kind,col,r);BOIL=ob;frames.push(cc);
  }
  s={frames,S};SPR.set(key,s);return s;
}
function bulletShape(g,kind,col,r){
  switch(kind){
    case 'note':{
      g.save();g.translate(-r*.15,r*.35);g.rotate(-.4);blobPath(g,0,0,r*.66,r*.46,7);g.restore();g.fillStyle=col;g.fill();inkStroke(g,2.5);
      g.beginPath();g.moveTo(r*.42,r*.18);g.lineTo(r*.42,-r*.95);g.quadraticCurveTo(r*.9,-r*.55,r*.85,-r*.1);inkStroke(g,4.5);
      g.beginPath();g.moveTo(r*.42,r*.18);g.lineTo(r*.42,-r*.95);g.quadraticCurveTo(r*.9,-r*.55,r*.85,-r*.1);g.lineWidth=2;g.strokeStyle=col;g.stroke();
      break}
    case 'star':star(g,0,0,r*1.15,r*.5,5,-Math.PI/2,3);g.fillStyle=col;g.fill();inkStroke(g,2.5);
      g.beginPath();g.arc(-r*.25,-r*.2,r*.16,0,TAU);g.fillStyle='rgba(255,255,255,.8)';g.fill();break;
    case 'seed':case 'petal':case 'drop':{
      g.beginPath();g.moveTo(r*1.1,0);g.quadraticCurveTo(r*.1,-r*(kind==='petal'?.95:.8),-r*.85,0);g.quadraticCurveTo(r*.1,r*(kind==='petal'?.95:.8),r*1.1,0);g.closePath();
      shade(g,0,0,r,r*.8,col);inkStroke(g,2.5);break}
    case 'clod':ball(g,0,0,r,r*.9,col,r*5.3,2.5,.16);
      g.fillStyle=INK;for(let i=0;i<3;i++){g.beginPath();g.arc(Math.cos(i*2.1)*r*.45,Math.sin(i*2.1)*r*.4,r*.1,0,TAU);g.fill()}break;
    case 'gear':{
      g.beginPath();const n=8;for(let i=0;i<n*2;i++){const a=i/(n*2)*TAU,rr=i%2?r*.78:r*1.08;g.lineTo(Math.cos(a-.15)*rr,Math.sin(a-.15)*rr);g.lineTo(Math.cos(a+.15)*rr,Math.sin(a+.15)*rr)}g.closePath();
      shade(g,0,0,r,r,col);inkStroke(g,2.5);g.beginPath();g.arc(0,0,r*.3,0,TAU);g.fillStyle=INK;g.fill();break}
    case 'bird':{
      ball(g,0,0,r,r*.75,col,9,2.5);g.beginPath();g.moveTo(r*.8,-r*.1);g.lineTo(r*1.35,r*.12);g.lineTo(r*.8,r*.3);g.closePath();g.fillStyle=GOLD;g.fill();inkStroke(g,2);
      flat(g,-r*.2,-r*.15,r*.55,r*.32,tint(col,-.25),3,2);pieEye(g,r*.4,-r*.25,r*.24,r*.3,1,0,1.5);break}
    case 'hand':{
      g.beginPath();g.moveTo(-r*.95,-r*.13);g.lineTo(r*.55,-r*.13);g.lineTo(r*.55,-r*.32);g.lineTo(r*1.0,0);g.lineTo(r*.55,r*.32);g.lineTo(r*.55,r*.13);g.lineTo(-r*.95,r*.13);g.closePath();
      g.fillStyle=col;g.fill();inkStroke(g,2.5);g.beginPath();g.arc(-r*.55,0,r*.22,0,TAU);g.fillStyle=GOLD;g.fill();inkStroke(g,2);break}
    case 'bone':g.save();g.rotate(.15);wrect(g,-r*.75,-r*.22,r*1.5,r*.44,3,.8);g.fillStyle=col;g.fill();inkStroke(g,2.5);for(const sx of [-1,1])for(const sy of [-1,1])ball(g,sx*r*.8,sy*r*.26,r*.3,r*.3,col,sx*3+sy,2.5);g.restore();break;
    case 'card':wrect(g,-r*.68,-r*.95,r*1.36,r*1.9,3,.5);g.fillStyle=col;g.fill();inkStroke(g,2.5);g.beginPath();g.moveTo(0,-r*.45);g.lineTo(r*.32,0);g.lineTo(0,r*.45);g.lineTo(-r*.32,0);g.closePath();g.fillStyle=col===PINK?'#fff6fa':RED;g.fill();break;
    case 'bomb':ball(g,0,0,r,r,col,5,2.5,.03);g.beginPath();g.moveTo(r*.5,-r*.6);g.quadraticCurveTo(r*.9,-r*1.2,r*1.2,-r*1.0);inkStroke(g,2.5);ball(g,r*1.2,-r*1.0,r*.22,r*.22,GOLD,2,1.5);g.beginPath();g.ellipse(-r*.35,-r*.35,r*.25,r*.15,-.6,0,TAU);g.fillStyle='rgba(255,255,255,.6)';g.fill();break;
    case 'torpedo':g.beginPath();g.moveTo(-r*1.05,0);g.lineTo(-r*1.45,-r*.6);g.lineTo(-r*1.45,r*.6);g.closePath();g.fillStyle=col;g.fill();inkStroke(g,2);ball(g,0,0,r*1.2,r*.52,col,4,2.5,.02);ball(g,r*1.08,0,r*.3,r*.4,RED,3,2);break;
    case 'plane':wrect(g,-r*.25,-r*.95,r*.5,r*1.9,2,.4);g.fillStyle=tint(col,.2);g.fill();inkStroke(g,2);ball(g,0,0,r,r*.42,col,5,2.5,.03);g.beginPath();g.ellipse(r*1.05,0,r*.12,r*.6,0,0,TAU);g.fillStyle='rgba(40,30,20,.55)';g.fill();pieEye(g,r*.45,-r*.04,r*.2,r*.22,1,0,1.2);break;
    case 'flak':star(g,0,0,r*1.15,r*.62,8,0,2);g.fillStyle=col;g.fill();inkStroke(g,2.5);ball(g,0,0,r*.45,r*.45,'#2a2028',3,2);break;
    case 'blot':ball(g,0,0,r,r*.9,col,r*7.7,2.5,.2);g.beginPath();g.ellipse(-r*.3,-r*.35,r*.25,r*.14,-.6,0,TAU);g.fillStyle='rgba(200,210,255,.55)';g.fill();break;
    case 'fake':ball(g,0,0,r,r,col,r*3.1,2.5,.14);brow(g,-r*.62,-r*.5,-r*.12,-r*.2,2.5);brow(g,r*.62,-r*.5,r*.12,-r*.2,2.5);g.fillStyle=INK;g.beginPath();g.arc(-r*.32,-r*.02,r*.13,0,TAU);g.fill();g.beginPath();g.arc(r*.32,-r*.02,r*.13,0,TAU);g.fill();g.beginPath();g.moveTo(-r*.36,r*.52);g.quadraticCurveTo(0,r*.24,r*.36,r*.52);inkStroke(g,2);break;
    case 'flame':g.beginPath();g.moveTo(0,-r*1.3);g.quadraticCurveTo(r*1.1,-r*.1,r*.6,r*.6);g.quadraticCurveTo(0,r*1.1,-r*.6,r*.6);g.quadraticCurveTo(-r*1.1,-r*.1,0,-r*1.3);g.closePath();shade(g,0,0,r,r,col);inkStroke(g,2.5);g.beginPath();g.ellipse(0,r*.25,r*.35,r*.45,0,0,TAU);g.fillStyle='#fff3c0';g.fill();break;
    case 'disc':g.beginPath();g.arc(0,0,r,0,TAU);g.fillStyle='#1c1820';g.fill();inkStroke(g,2.5);g.strokeStyle='rgba(239,226,194,.3)';g.lineWidth=1;for(const k of [.55,.75,.9]){g.beginPath();g.arc(0,0,r*k,0,TAU);g.stroke()}g.beginPath();g.arc(0,0,r*.34,0,TAU);g.fillStyle=col;g.fill();inkStroke(g,1.5);g.beginPath();g.arc(0,0,r*.08,0,TAU);g.fillStyle=INK;g.fill();g.beginPath();g.ellipse(-r*.4,-r*.45,r*.2,r*.08,-.7,0,TAU);g.fillStyle='rgba(255,255,255,.5)';g.fill();break;
    case 'frame':wrect(g,-r*.9,-r*.7,r*1.8,r*1.4,2,.4);g.fillStyle='#1a1416';g.fill();inkStroke(g,2);g.fillStyle=col;g.fillRect(-r*.5,-r*.45,r,r*.9);g.fillStyle=CREAM;for(const sy of [-.5,-.1,.3])for(const sx of [-.78,.62])g.fillRect(sx*r,sy*r,r*.16,r*.2);break;
    case 'popcorn':for(let i=0;i<5;i++){const a=i*1.26;ball(g,Math.cos(a)*r*.45,Math.sin(a)*r*.4,r*.55,r*.5,col,i+2,2,.15)}ball(g,0,0,r*.45,r*.42,'#f7e7a0',9,0,.1);break;
    case 'scale':g.beginPath();g.moveTo(r*1.1,0);g.lineTo(0,-r*.75);g.lineTo(-r*1.1,0);g.lineTo(0,r*.75);g.closePath();shade(g,0,0,r,r*.75,col);inkStroke(g,2.5);g.beginPath();g.moveTo(r*.5,0);g.lineTo(0,-r*.35);g.lineTo(-r*.5,0);g.lineTo(0,r*.35);g.closePath();g.fillStyle='rgba(28,19,12,.3)';g.fill();break;
    case 'puff':ball(g,0,0,r,r*.8,col,4,3,.12);pieEye(g,-r*.3,-r*.1,r*.18,r*.24,-1,0,1.5);pieEye(g,r*.1,-r*.1,r*.18,r*.24,-1,0,1.5);break;
    default:ball(g,0,0,r,r,col,r*3.1,2.5,.06);g.beginPath();g.ellipse(-r*.35,-r*.4,r*.28,r*.17,-.6,0,TAU);g.fillStyle='rgba(255,255,255,.75)';g.fill();
  }
}

/* =========================================================
   SAVE SYSTEM — this browser always; the viewer's account when available
   ========================================================= */
const SAVE_KEY='inkwell-gauntlet-save-v1';
function defaultSave(){return{v:1,coins:0,owned:['pencil'],equip:{w1:'pencil',w2:null,charm:null},clears:{},eggs:{},lv:{},expert:false,deaths:0,settings:{sound:true,autofire:false},updated:0}}
function normalize(s){const d=defaultSave();if(!s||typeof s!=='object')return d;const o=Object.assign(d,s);o.equip=Object.assign(defaultSave().equip,s.equip||{});o.settings=Object.assign(defaultSave().settings,s.settings||{});if(!Array.isArray(o.owned))o.owned=['pencil'];if(!o.owned.includes('pencil'))o.owned.unshift('pencil');return o}
function readLocal(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.v===1)return normalize(s)}catch(e){}return null}
function writeLocal(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));return true}catch(e){return false}}
let save=readLocal()||defaultSave();
let saveWhere=readLocal()?'browser':'none', cloudDoc=null, cloudBusy=false, cloudDirty=false, savedFlash=0;
function persist(){save.updated=Date.now();const ok=writeLocal();if(ok&&saveWhere==='none')saveWhere='browser';savedFlash=2.2;pushCloud()}
async function pushCloud(){
  if(!cloudDoc)return;if(cloudBusy){cloudDirty=true;return}
  cloudBusy=true;
  try{await cloudDoc.set(JSON.parse(JSON.stringify(save)));saveWhere='account'}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'))cloudDoc=null}
  cloudBusy=false;if(cloudDirty){cloudDirty=false;pushCloud()}
}
async function initCloud(){
  try{
    const cl=window.claude;if(!cl||!cl.use)return;
    const [user,db]=await Promise.all([cl.use('user'),cl.use('db')]);if(!user||!db)return;
    const id=await user.id();if(!id)return;
    cloudDoc=db.doc('data/users/'+id+'/save');
    const snap=await cloudDoc.get();
    if(snap.exists){const d=normalize(JSON.parse(JSON.stringify(snap.data())));

const inp={cur:{},prev:{},
  poll(){
    const now={};for(const a in KEYMAP)now[a]=KEYMAP[a].some(k=>keys[k])||!!touchHeld[a];
    if(touchHeld.jump)now.confirm=true;if(touchHeld.dash)now.back=true;

      if(b(0)){now.jump=true;now.confirm=true}if(b(2)||b(7))now.shoot=true;if(b(1)){now.ex=true;now.back=true}if(b(5))now.dash=true;if(b(4)||b(6))now.lock=true;if(b(3))now.swap=true;if(b(9))now.pause=true;}
    this.prev=this.cur;this.cur=now;
  },
  held(a){return !!this.cur[a]},
  hit(a){return (this.cur[a]&&!this.prev[a])||KEYMAP[a].some(k=>tapped[k])||!!touchTap[a]||(a==='confirm'&&!!touchTap.jump)||(a==='back'&&!!touchTap.dash)},

  const a=el.dataset.act;
  const on=e=>{e.preventDefault();audioInit();if(!touchHeld[a])touchTap[a]=true;touchHeld[a]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}};

(()=>{const pad=document.getElementById('pad');
  const set=e=>{const r=pad.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;
    const was={...touchHeld};touchHeld.left=dx<-.14;touchHeld.right=dx>.14;touchHeld.up=dy<-.14;touchHeld.down=dy>.14;

  if(MUS.next<c.currentTime-.3)MUS.next=c.currentTime+.05;
  while(MUS.next<c.currentTime+.15){
    const st=MUS.step%128,bar=Math.floor(st/8),k=st%8,root=s.prog[bar],ch=s.q(root),t=MUS.next+(k%2?sp*.16:0),D=AU.mus;
    if(k===0)tone(mf(36+s.key+root),.28,'triangle',.3,0,D,t);
    if(k===4)tone(mf(36+s.key+root+7),.28,'triangle',.26,0,D,t);
    if(k===2||k===6)for(const tt of ch)tone(mf(60+s.key+root+tt),.09,'square',.025,0,D,t);
    if(k===0||k===4)tone(140,.1,'sine',.25,.4,D,t);
    if(k===2||k===6)noiz(.08,.07,1800,D,t);
    if(k%2)noiz(.03,.03,7000,D,t,'highpass');
    const m=s.mel[st];if(m)tone(mf(m+s.key),sp*.9,s.lead,.045,0,D,t);
    MUS.step++;MUS.next+=sp;
  }
}

function updateBullets(dt){

  for(let i=arr.length-1;i>=0;i--){const b=arr[i];b.t+=dt;
    if(b.stopAt&&!b.stopped&&b.t>=b.stopAt){b.stopped=1;b.vx=b.vy=0}

    if(b.tick){b.tickT+=dt;if(b.tickT>=b.tickEvery){b.tickT-=b.tickEvery;b.tick(b)}}
    let dead=b.t>b.life;
    if(b.returns&&b.t>.6&&b.vx>0&&b.x>b.returns.x)dead=true;
    if(mode==='plat'&&b.groundDie&&b.cy>GROUND-b.r*.4){dead=true;dust(b.cx,GROUND,3);if(b.kind==='clod')SFX.hit();if(b.splash)b.splash(b)}

  }

/* =========================================================
   BOSSES — attack scripts are generators that yield wait times
   ========================================================= */
class Boss{
  constructor(hp){this.maxHp=this.hp=Math.round(hp*(save.expert?1.25:.78));this.phase=0;this.t=0;this.flash=0;this.wait=0;this.gen=null;this.trans=0;this.mouth=0;this.dead=false;this.deathT=0;this.x=0;this.y=0;this.thresholds=[.66,.33]}
  start(){this.gen=this.pattern(0);this.wait=0}
  update(dt){
    this.t+=dt;this.flash=Math.max(0,this.flash-dt);this.mouth=Math.max(0,this.mouth-dt*1.6);
    this.motion(dt);
    if(this.dead){this.deathT+=dt;if(Math.random()<dt*12){const h=this.hurt()[0];if(h)boom(h[0]+rand(-h[2],h[2])*.7,h[1]+rand(-h[2],h[2])*.7,.8)}return}
    if(this.trans>0){this.trans-=dt*(megaOn()?4:1);if(this.trans<=0){this.gen=this.pattern(this.phase);this.wait=0}return}
    if(!this.gen)return;
    this.wait-=dt*(this.pace||1);let guard=0;
    while(this.wait<=0&&guard++<60){const r=this.gen.next();if(r.done)this.gen=this.pattern(this.phase);else this.wait+=r.value||0}
  }
  damage(d){
    if(this.dead||this.trans>0)return false;
    this.hp-=d;this.flash=.05;
    if(this.hp<=0){this.hp=0;this.dead=true;F.bossDefeated();return true}
    if(this.phase<this.thresholds.length&&this.hp/this.maxHp<=this.thresholds[this.phase]){this.phase++;this.trans=1.3;this.gen=null;this.mouth=1.2;F.shake=10;SFX.boom();this.onPhase&&this.onPhase(this.phase)}
    return true;
  }
  look(){const [px,py]=aimPt(),h=this.hurt()[0]||[this.x,this.y];const a=Math.atan2(py-h[1],px-h[0]);return[Math.cos(a),Math.sin(a)]}
  pattern(p){const ph=this.phaseList[Math.min(p,this.phaseList.length-1)];return ph.fn.call(this)}
  motion(){}hurt(){return[]}contact(){return false}
  st(){const [lx,ly]=this.look();return{t:this.t,mood:Math.min(2,Math.floor(this.phase*3/this.phaseList.length)+(this.trans>0?1:0)),mouth:this.mouth,flash:this.flash>0,lx,ly}}
}

  motion(dt){this.rise=Math.min(1,this.rise+dt*.9);this.bob=Math.sin(this.t*2.2)*6+(this.phase>=3?Math.sin(this.t*30)*1.5:0)+(1-ease(this.rise))*260}

    fire2(x0,y0,(tx-x0)/T,(GROUND-14-y0-.5*g*T*T)/T,{kind:'clod',col:'#9a6a3a',r:13,g,groundDie:true,pink,raw:true})}
  *pClods(){for(let n=0;;n++){

    yield .8;if(n%2===1){F.hazards.push(hzWorm(700,320));yield 1.5}}}
  *pSeeds(){for(let n=0;;n++){
    for(let i=0;i<2;i++){this.mouth=1;const a=angTo(this.mx(),this.my());fan(this.mx(),this.my(),a,5,1.5,220,{kind:'seed',col:'#e6cf7a',r:8,wave:16,waveF:6});if(i===1)fire(this.mx(),this.my(),a+.19,190,{kind:'seed',pink:true,r:10,wave:16,waveF:6});yield 1.25}

  *pSprout(){for(let n=0;;n++){
    this.mouth=1;

    yield .5;for(let k=0;k<2;k++){F.hazards.push(hzSpike(clamp(PL().x,40,600),.6,.5));yield .5}
    fan(this.mx(),this.my(),angTo(this.mx(),this.my()),7,1.0,280,{kind:'seed',col:'#e6cf7a',r:8});yield 1.0}}

  *pHop(){for(let n=0;;n++){

  *pDrums(){for(let n=0;;n++){

/* =========================================================
   PLAYER SHOTS
   ========================================================= */
function pshot(x,y,a,s,dmg,o={}){F.shots.push(Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,dmg:dmg*(has('goldnib')?1.2:1)*(F.player?dmgMul(F.player.weapons[F.player.wi]):1),r:7,kind:'lead',life:1.6,t:0,g:0,bounce:0,home:0,pierce:false,hitDone:false},o))}
function fireWeapon(p,id,mx,my,a){
  const air=F.mode==='air';
  switch(id){
    case 'pencil':pshot(mx,my,a+rand(-.025,.025),1150,4,{kind:'lead'});break;
    case 'mega':for(let k=-1;k<=1;k++)pshot(mx,my,a+k*.25,1300,28,{kind:'mega',r:16,home:16,pierce:true,life:1.6});if(Math.random()<.3)F.shake=Math.max(F.shake,3);break;
    case 'spread':for(let i=-2;i<=2;i++)pshot(mx,my,a+i*.16,820,2.3,{kind:'drop',r:6,life:.3});break;
    case 'homing':p.alt=!p.alt;pshot(mx,my,a+(p.alt?-.45:.45),640,2.7,{kind:'nib',home:7,life:2.2});break;
    case 'storm':pshot(mx,my,a+rand(-.03,.03),1700,9,{kind:'bolt',r:8,life:.8});break;
    case 'boomer':pshot(mx,my,a,1050,7,{kind:'boomer',r:14,pierce:true,life:3,boom:1});break;
    case 'starfall':{const h=F.boss.hurt()[0];if(!h){pshot(mx,my,a,1000,7,{kind:'starshot',r:10});break}
      const sx=h[0]+rand(-160,120),sy=-24;pshot(sx,sy,Math.atan2(h[1]+rand(-h[2]*.4,h[2]*.4)-sy,h[0]-sx),1050,7,{kind:'starshot',r:10,life:1.4});break}
    case 'flamer':pshot(mx,my,a+rand(-.13,.13),rand(560,680),3.4,{kind:'flame',r:12,life:.32,pierce:true});break;
    case 'wisp':pshot(mx,my,a,0,10,{kind:'wisp',r:10,life:2.6,orb:rand(0,TAU),orbT:.4});break;
    case 'lobber':{const s=air?520:560;F.shots.push({x:mx,y:my,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(air?160:300),g:air?900:1500,bounce:air?0:1,dmg:11.5*(has('goldnib')?1.2:1)*dmgMul('lobber'),r:12,kind:'bomb',life:2.4,t:0,home:0,pierce:false});break}
  }
  SFX.shot(id);
}
function updateShots(dt){
  const b=F.boss,hz=b.hurt();
  for(let i=F.shots.length-1;i>=0;i--){const s=F.shots[i];s.t+=dt;
    if(s.home&&hz.length){const sp=Math.hypot(s.vx,s.vy),cur=Math.atan2(s.vy,s.vx),tgt=Math.atan2(hz[0][1]-s.y,hz[0][0]-s.x);let d=Math.atan2(Math.sin(tgt-cur),Math.cos(tgt-cur));const na=cur+clamp(d,-s.home*dt,s.home*dt);s.vx=Math.cos(na)*sp;s.vy=Math.sin(na)*sp}
    if(s.boom===1&&s.t>.52){s.boom=2;s.hitDone=false}
    if(s.boom===2){const P=F.player,py=F.mode==='plat'?P.y-26:P.y,sp=Math.min(1100,Math.hypot(s.vx,s.vy)+1800*dt),a=Math.atan2(py-s.y,P.x-s.x);s.vx=Math.cos(a)*sp;s.vy=Math.sin(a)*sp;if(dist(s.x,s.y,P.x,py)<26)s.t=9}
    if(s.orbT){const P=F.player,py=F.mode==='plat'?P.y-30:P.y;if(s.t<s.orbT){const a=s.orb+s.t*11;s.x=P.x+Math.cos(a)*36;s.y=py+Math.sin(a)*30}

/* =========================================================
   FILM POST-PROCESS — grain, vignette, scratches, flicker
   ========================================================= */
const grain=[0,1,2,3].map(k=>{const g=document.createElement('canvas');g.width=320;g.height=180;const x=g.getContext('2d'),d=x.createImageData(320,180),r=mulberry(k*17+3);
  for(let i=0;i<d.data.length;i+=4){const v=r();if(v<.035){d.data[i]=d.data[i+1]=d.data[i+2]=20;d.data[i+3]=110}else if(v<.045){d.data[i]=d.data[i+1]=d.data[i+2]=250;d.data[i+3]=90}}
  x.putImageData(d,0,0);return g});
let vign=null;
function post(c){
  c.globalCompositeOperation='multiply';c.fillStyle='#f4e2bf';c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over';
  if(!reduceMotion){c.globalAlpha=.55;c.drawImage(grain[Math.floor(CLOCK*24)%4],0,0,W,H);c.globalAlpha=1}
  if(!vign){vign=document.createElement('canvas');vign.width=480;vign.height=270;const v=vign.getContext('2d'),g=v.createRadialGradient(240,135,90,240,135,300);g.addColorStop(0,'rgba(30,18,8,0)');g.addColorStop(1,'rgba(30,18,8,.6)');v.fillStyle=g;v.fillRect(0,0,480,270)}
  c.drawImage(vign,0,0,W,H);
  if(!reduceMotion){
    const sc=Math.floor(CLOCK*8);if(h1(sc)<.35){const x=h1(sc+.5)*W;c.strokeStyle='rgba(250,240,220,.35)';c.lineWidth=1.2;c.beginPath();c.moveTo(x,0);c.lineTo(x+h1(sc+.7)*6-3,H);c.stroke()}
    if(h1(sc+3.3)<.12){const x=h1(sc+1.1)*W,y=h1(sc+2.2)*H;c.strokeStyle='rgba(28,19,12,.45)';c.lineWidth=1.5;c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+20,y-10,x+10,y+20,x+34,y+14);c.stroke()}
    c.fillStyle=`rgba(20,12,6,${h1(Math.floor(CLOCK*14))*.05})`;c.fillRect(0,0,W,H);
  }
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(1/30,Math.max(0,(now-last)/1000));last=now;CLOCK+=dt;BOIL=Math.floor(CLOCK*10)%3;

  ctx.setTransform(RS,0,0,RS,0,0);ctx.clearRect(0,0,W,H);
  hits=[];try{scene.draw(ctx)}catch(e){console.error(e)}

}
